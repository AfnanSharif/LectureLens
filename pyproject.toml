[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lecturelens-video-summarizer"
version = "1.0.0"
description = "Offline educational video summaries, quizzes, and feedback"
requires-python = ">=3.10"
dependencies = ["Flask>=3.0,<4", "python-dotenv>=1.0,<2"]

[project.scripts]
lecturelens = "video_summarizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
